# Builds the Windows exe and the macOS dmg (universal: Apple Silicon and Intel).
# The files appear under Actions > Export > the run > Artifacts, and on main also as a GitHub release v<version>.
name: Export

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - export_presets.cfg
      - project.godot
      - .github/workflows/export.yml
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot, export templates and genisoimage
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot" && rm godot.zip
          curl -sSLo "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" templates/version.txt templates/windows_release_x86_64.exe \
            templates/windows_debug_x86_64.exe templates/macos.zip -d "$dir"
          rm "$RUNNER_TEMP/templates.tpz"
          sudo apt-get update -q && sudo apt-get install -y -q genisoimage

      - name: Export
        run: |
          mkdir -p build/windows build/macos
          "$RUNNER_TEMP/godot" --headless --path . --import
          "$RUNNER_TEMP/godot" --headless --path . --export-release "Windows" build/windows/ExtinctionHollow.exe
          "$RUNNER_TEMP/godot" --headless --path . --export-release "macOS" build/macos/ExtinctionHollow.zip
          test -s build/windows/ExtinctionHollow.exe && test -s build/macos/ExtinctionHollow.zip

      - name: Build dmg
        run: |
          mkdir dmg
          unzip -q build/macos/ExtinctionHollow.zip -d dmg
          ln -s /Applications dmg/Applications
          genisoimage -quiet -V "Extinction Hollow" -D -R -l -no-pad -o build/macos/ExtinctionHollow.dmg dmg

      - uses: actions/upload-artifact@v5
        with:
          name: ExtinctionHollow-Windows
          path: build/windows/ExtinctionHollow.exe
          retention-days: 30

      - uses: actions/upload-artifact@v5
        with:
          name: ExtinctionHollow-macOS
          path: build/macos/ExtinctionHollow.dmg
          retention-days: 30

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          tag="v$version"
          cp build/windows/ExtinctionHollow.exe "ExtinctionHollow-$version-windows.exe"
          cp build/macos/ExtinctionHollow.dmg "ExtinctionHollow-$version-macos.dmg"
          files="ExtinctionHollow-$version-windows.exe ExtinctionHollow-$version-macos.dmg"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --target "$GITHUB_SHA" --title "Extinction Hollow $version" \
              --notes "Windows (64 bit) and macOS (Apple Silicon and Intel)."
          fi
